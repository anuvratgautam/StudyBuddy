# docker-compose.yml
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studybuddy-backend:latest
    container_name: studybuddy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    # NOTE: no bind-mount here so the image-installed Python deps remain available
    # volumes:
    #   - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: studybuddy-frontend:latest
    container_name: studybuddy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                # visit http://localhost:3000
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AUTH_BASE_URL=http://localhost:9000
    # If you prefer live dev (vite dev server), remove build+nginx and run npm dev on host.
    # volumes:
    #   - ./frontend:/app

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    image: studybuddy-auth-server:latest
    container_name: studybuddy-auth
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=development
    # NOTE: do NOT mount the entire auth-server folder to /app during startup,
    # because that will hide node_modules installed in the image and cause
    # "Cannot find module 'express'" errors. If you want to edit code live,
    # either run `npm install` in your host auth-server or use an explicit
    # named volume for node_modules.
    # volumes:
    #   - ./auth-server:/app

