apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studybuddy-ingress
  namespace: studybuddy
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: studybuddy.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: studybuddy-frontend
            port:
              number: 80
  - host: api.studybuddy.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: studybuddy-backend
            port:
              number: 8000
